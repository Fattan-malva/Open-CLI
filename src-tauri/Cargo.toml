[package]
name = "open-cli"
version = "0.1.0"
description = "Open CLI desktop terminal"
authors = ["Open CLI"]
edition = "2021"

[lib]
name = "open_cli_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
portable-pty = "0.9"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winapi = { version = "0.3", features = [
  "handleapi",
  "jobapi2",
  "minwindef",
  "ntdef",
  "tlhelp32",
  "winbase",
  "winnt",
] }
