[package]
name = "open-cli"
version = "1.2.0"
description = "Open CLI desktop terminal"
authors = ["Open CLI"]
edition = "2021"

[lib]
name = "open_cli_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
regex = "1"
tauri = { version = "2", features = ["unstable"] }
portable-pty = "0.9"
base64 = "0.22"
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sysinfo = "0.33"
winapi = { version = "0.3", features = [
  "handleapi",
  "jobapi2",
  "minwindef",
  "ntdef",
  "sysinfoapi",
  "tlhelp32",
  "winbase",
  "winnt",
] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows-core = "0.62"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Memory",
] }
